name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Facebook posts and Bandsintown dates are fetched at build time,
  # so rebuild hourly to pick up new posts without a manual deploy.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  # Lets the keepalive step re-enable this workflow; GitHub disables
  # scheduled workflows after 60 days without repository activity.
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://udishlomomusic.com/
      - name: Verify static site
        run: npm run check:static
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://udishlomomusic.com/
      # On scheduled runs, keep the last good deploy if Facebook could not be reached.
      - name: Require Facebook posts on scheduled runs
        if: github.event_name == 'schedule'
        run: |
          if grep -q "latest posts could not be loaded" out/index.html; then
            echo "::error::Facebook posts could not be loaded; skipping deploy."
            exit 1
          fi
      - name: Keep scheduled rebuilds enabled
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Deploy site again
        if: steps.deployment.outcome == 'failure'
        id: deployment-retry
        uses: actions/deploy-pages@v5
